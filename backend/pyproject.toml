[project]
name = "brain-fresh-backend"
version = "0.1.0"
description = "Brain engagement analysis backend using TRIBE v2"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.42.0",
    "openai>=1.0",
    "tribev2 @ git+https://github.com/facebookresearch/tribev2.git",
    "numpy>=1.24.0",
    "nilearn>=0.10.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "aiofiles>=24.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
